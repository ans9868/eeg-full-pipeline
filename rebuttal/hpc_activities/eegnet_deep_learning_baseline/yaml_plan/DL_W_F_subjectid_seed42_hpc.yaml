  reuse_processed_subjects: 'No'
  save_processed_subjects: 'Yes'
  reuse_transformed: 'No'
  save_transformed: 'No'
  reuse_transformed_across_experiments: 'No'
  reuse_processed_subjects_across_experiments: 'No'
preprocessing:
  window_size: 3.0
  sliding_window: 0.5
  downsampling: 64
  reject_by_annotation: 'Yes'
  normalize_psd: 'No'
  use_epoch_rejection: 'Yes'
  epoch_rejection:
    reject: 800.0
    flat: 0.3
  extreme_datapoint_removal: null
feature_extraction:
  method: welch
  features:
    per_channel_across_bands: []
    per_channel_per_band: []
  show_intermediate_results: 'No'
  show_intermediate_counts: 'No'
  output_format: raw-waveform
feature_transformation:
  transformations: null
  synthetic: None
  anova_label_column: SubjectID
  anova_label_type: categorical
data_transformation_strategy:
  strategy: Within-subject (intra subject split) train/test split (80/20 per subject)
    - each subject contributes to both train and test
  intra_test_train_split:
    train_ratio: 0.8
    random_seed: 42
    split_method: random
  shuffle_transformed_data: 'Yes'
pyspark:
  master: 12
  driver_memory: 36
  executor_memory: 36
  executor_cores: 12
  shuffle_partitions: 24
ray:
  search_strategies:
  - grid_search
  grid_search:
    models:
    - KNN
    model_configs:
      KNN:
        use_default: false
        n_neighbors:
        - 3
        weights:
        - uniform
        metric:
        - euclidean
    max_concurrent: '1'
    cv_folds: '2'
    max_concurrent_trials: 1
  ax:
    models: []
    max_concurrent: '1'
    cv_folds: '2'
    max_concurrent_trials: 1
  metric: accuracy
  mode: max
  graph_data_visualization:
    save_prediction_outputs: 'No'
    best_models_graph: 'No'
    per_model_accross_hyperparameters_graph: 'No'
    per_model_per_hyperparameter_across_folds_graph: 'No'
    per_subject_analysis_graph: 'No'
    per_subject_hyperparameter_analysis: 'No'
  resources:
    num_cpus: 12
    memory_gb: 42
    object_store_memory_gb: 8
    num_gpus: 0
    dashboard_port: '8265'
deep_learning_smoke:
  source: raw-waveform
  processed_subjects: /app/data/DL_W_F_subjectid_seed42_hpc/processed_subjects
  output_dir: /app/data/DL_W_F_subjectid_seed42_hpc/deep_learning_smoke_outputs
  max_rows: 1000000
  epochs: 25
  batch_size: 32
  learning_rate: 0.001
  validation_split: 0.2
  chunk_size: 32
  embed_dim: 32
  heads: 4
  eegnet_dropout: 0.25
  transformer_dropout: 0.1
  early_stopping:
    enabled: 'Yes'
    monitor: validation_loss
    mode: min
    patience: 5
    min_delta: 0.0001
    restore_best_weights: 'Yes'
  label_column: SubjectID
  splits:
  - subject_overlap_smoke
  models:
  - canonical_eegnet
  - eeg_conformer_small
